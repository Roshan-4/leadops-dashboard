<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadOps</title>
<link rel="icon" href="assets/leadops-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
/* ---- Tokens (from the LeadOps "New Job v2" design) ---- */
:root, :root[data-theme=light] {
  --bg:#f4f6fb; --text:#0f172a; --text2:rgba(15,23,42,.66); --text3:rgba(15,23,42,.45);
  --card:rgba(255,255,255,.84); --card-bd:rgba(15,23,42,.08); --chip:rgba(15,23,42,.05); --chip-bd:rgba(15,23,42,.12); --chip-hover:rgba(15,23,42,.08);
  --pop:#ffffff; --header:rgba(255,255,255,.9); --orb:.22; --shadow:0 8px 30px rgba(15,23,42,.08);
  --accent:oklch(0.55 0.18 260); --accent-soft:oklch(0.55 0.18 260 / .1);
  --green:oklch(0.72 0.17 152); --green-ink:oklch(0.42 0.12 152); --green-soft:oklch(0.72 0.17 152 / .15);
  --red:oklch(0.62 0.2 25); --red-ink:oklch(0.5 0.18 25); --red-soft:oklch(0.65 0.2 25 / .1); --red-bd:oklch(0.65 0.2 25 / .3);
  --amber:oklch(0.8 0.16 75); --amber-soft:oklch(0.8 0.16 75 / .18); --amber-ink:oklch(0.47 0.12 62);
  --disabled:rgba(15,23,42,.06); --disabled-ink:rgba(15,23,42,.38); --scrim:rgba(15,23,42,.45);
  --brand-green:#10B981; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg:#070b18; --text:#f1f5ff; --text2:rgba(226,232,240,.66); --text3:rgba(226,232,240,.45);
  --card:rgba(24,30,56,.76); --card-bd:rgba(255,255,255,.12); --chip:rgba(255,255,255,.08); --chip-bd:rgba(255,255,255,.14); --chip-hover:rgba(255,255,255,.11);
  --pop:#151b31; --header:rgba(12,17,34,.9); --orb:.42; --shadow:0 10px 40px rgba(0,0,0,.3);
  --accent:oklch(0.76 0.13 250); --accent-soft:oklch(0.76 0.13 250 / .16);
  --green-ink:oklch(0.86 0.13 152); --green-soft:oklch(0.72 0.17 152 / .16);
  --red:oklch(0.7 0.18 25); --red-ink:oklch(0.84 0.1 28); --red-soft:oklch(0.7 0.17 25 / .12); --red-bd:oklch(0.7 0.17 25 / .35);
  --amber:oklch(0.82 0.15 75); --amber-soft:oklch(0.82 0.15 75 / .14); --amber-ink:oklch(0.89 0.11 80);
  --disabled:rgba(255,255,255,.07); --disabled-ink:rgba(226,232,240,.38); --scrim:rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme=dark] { --bg:#070b18; --text:#f1f5ff; --text2:rgba(226,232,240,.66); --text3:rgba(226,232,240,.45);
  --card:rgba(24,30,56,.76); --card-bd:rgba(255,255,255,.12); --chip:rgba(255,255,255,.08); --chip-bd:rgba(255,255,255,.14); --chip-hover:rgba(255,255,255,.11);
  --pop:#151b31; --header:rgba(12,17,34,.9); --orb:.42; --shadow:0 10px 40px rgba(0,0,0,.3);
  --accent:oklch(0.76 0.13 250); --accent-soft:oklch(0.76 0.13 250 / .16);
  --green-ink:oklch(0.86 0.13 152); --green-soft:oklch(0.72 0.17 152 / .16);
  --red:oklch(0.7 0.18 25); --red-ink:oklch(0.84 0.1 28); --red-soft:oklch(0.7 0.17 25 / .12); --red-bd:oklch(0.7 0.17 25 / .35);
  --amber:oklch(0.82 0.15 75); --amber-soft:oklch(0.82 0.15 75 / .14); --amber-ink:oklch(0.89 0.11 80);
  --disabled:rgba(255,255,255,.07); --disabled-ink:rgba(226,232,240,.38); --scrim:rgba(0,0,0,.6); color-scheme: dark; }

/* ---- Base ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif; transition: background .25s, color .25s; min-height: 100vh; overflow-x: hidden; }
a { color: var(--accent); text-decoration: none; } a:hover { opacity: .8; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
.orbs { position: fixed; inset: 0; pointer-events: none; overflow: hidden; opacity: var(--orb); z-index: 0; }
.orbs i { position: absolute; border-radius: 50%; }
.orbs i:nth-child(1) { width:620px; height:620px; left:-160px; top:-200px; background:oklch(0.6 0.22 275); filter:blur(140px); }
.orbs i:nth-child(2) { width:520px; height:520px; right:-120px; top:120px; background:oklch(0.72 0.13 195); filter:blur(150px); opacity:.8; }
.orbs i:nth-child(3) { width:560px; height:560px; left:35%; bottom:-260px; background:oklch(0.65 0.2 320); filter:blur(160px); opacity:.7; }
.shell { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }
.muted { color: var(--text2); } .faint { color: var(--text3); } .small { font-size: 12px; } .xs { font-size: 11px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }

/* ---- Header ---- */
header.top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px clamp(16px,3vw,32px); background: var(--header); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid var(--card-bd); }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; flex: none; background: #0B1F3B; }
.brand .logo img { width: 100%; height: 100%; display: block; transform: scale(1.06); }
.brand b { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; display: block; line-height: 1.2; }
.brand b span { color: var(--brand-green); }
nav.tabs { display: flex; gap: 4px; padding: 3px; border-radius: 10px; background: var(--card); border: 1px solid var(--chip-bd); font-size: 13px; box-shadow: var(--shadow); }
nav.tabs a { display: flex; align-items: center; gap: 8px; white-space: nowrap; padding: 5px 12px; border-radius: 8px; color: var(--text2); font-weight: 500; transition: background .15s; }
nav.tabs a[aria-current=page] { background: var(--accent); color: var(--bg); font-weight: 700; }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: var(--chip); border: 1px solid var(--chip-bd); color: var(--text); cursor: pointer; }
.iconbtn:hover { background: var(--chip-hover); }
.userchip { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text2); }
main.center { max-width: 420px; display: flex; flex-direction: column; gap: 14px; padding-top: 48px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text2); }
.field input { font: inherit; font-size: 14px; color: var(--text); padding: 9px 11px; border-radius: 10px; background: var(--pop); border: 1px solid var(--chip-bd); }
.field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.2s infinite; }
.pulse.red { background: var(--red); animation-duration: 1s; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
@keyframes spin { to { transform: rotate(360deg) } }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--chip-bd); border-top-color: var(--accent); display: inline-block; animation: spin .8s linear infinite; flex: none; }

/* ---- Layout ---- */
main { width: 100%; margin: 0 auto; padding: 12px clamp(16px,3vw,32px) 28px; }
main.newjob { max-width: 1400px; display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 960px) { main.newjob { grid-template-columns: minmax(0, 1fr); } }
main.narrow { max-width: 1200px; display: flex; flex-direction: column; gap: 14px; }
.pagehead { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: -6px; }
.pagehead span { font-size: 11.5px; }
.pagehead h1 { font-size: 18px; font-weight: 700; line-height: 1.2; }
.colmain { min-width: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.colmain .wide { grid-column: 1 / -1; }
@media (max-width: 720px) { .colmain { grid-template-columns: minmax(0, 1fr); } }
.card { padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--card-bd); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.big { border-radius: 16px; }
aside.card { position: sticky; top: 64px; gap: 10px; }
@media (max-width: 1080px) { aside.card { position: static; } }
.sechead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.sechead h2 { font-size: 15px; font-weight: 700; }
.stepnum { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--chip-hover); color: var(--text); flex: none; }
.stepnum.done { background: var(--green); color: #fff; }
.panel { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 12px; background: var(--chip); border: 1px solid var(--card-bd); }

/* ---- Controls ---- */
.btn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 9px; background: var(--chip); border: 1px solid var(--chip-bd); color: var(--text); cursor: pointer; }
.btn:hover { background: var(--chip-hover); }
.btn.sm { font-size: 11.5px; padding: 4px 9px; border-radius: 8px; }
.btn.go { font-weight: 700; color: #04210f; border: 0; background: linear-gradient(135deg, var(--green), oklch(0.76 0.15 170)); padding: 8px 14px; }
.btn.danger { color: var(--red-ink); background: var(--red-soft); border-color: var(--red-bd); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.cta { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font-size: 14px; font-weight: 700; padding: 11px 14px; border-radius: 11px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--green), oklch(0.76 0.15 170)); color: #04210f; box-shadow: 0 10px 30px oklch(0.72 0.17 152 / .35); }
.cta:disabled { background: var(--disabled); color: var(--disabled-ink); box-shadow: none; cursor: not-allowed; }
.cta svg { margin-left: auto; }
input.numin { width: 72px; font: inherit; font-size: 15px; font-weight: 700; color: var(--text); padding: 5px 8px; border-radius: 9px; background: var(--pop); border: 1px solid var(--chip-bd); }
input.numin:disabled { opacity: .5; }
label.lbl { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--text2); }
.pill { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pill.ok { background: var(--green-soft); color: var(--green-ink); }
.pill.fail { background: var(--red-soft); color: var(--red-ink); }
.pill.warn { background: var(--amber); color: #231600; }
.pill.warnsoft { background: var(--amber-soft); color: var(--amber-ink); }
.pill.skip { background: var(--chip-hover); color: var(--text2); }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.pill.pend { background: transparent; color: var(--text3); }
.pill.red { background: var(--red); color: #fff; }

/* ---- Upload ---- */
.drop { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1.5px dashed var(--chip-bd); background: var(--chip); cursor: pointer; }
.drop:hover, .drop.over { background: var(--chip-hover); border-color: var(--accent); }
.ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.ico.green { width: 34px; height: 34px; background: var(--green-soft); color: var(--green-ink); }
.filebar { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--chip); border: 1px solid var(--chip-bd); flex-wrap: wrap; }
.note { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 10px; font-size: 12px; max-height: 120px; overflow-y: auto; }
.note.red { background: var(--red-soft); border: 1px solid var(--red-bd); }
.note.red > b:first-child { color: var(--red-ink); }
.note.amber { background: var(--amber-soft); }
.reject { border-radius: 16px; border: 1px solid var(--red-bd); overflow: hidden; }
.reject .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--red); color: #fff; }
.reject .body { display: flex; flex-direction: column; gap: 14px; padding: 16px; background: var(--red-soft); }
table.sample { border-collapse: collapse; font-size: 13px; min-width: 760px; }
table.sample th, table.sample td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--card-bd); white-space: nowrap; }
table.sample th.missing { color: var(--red-ink); text-decoration: underline wavy; }

/* ---- Range ---- */
.range { position: relative; height: 20px; }
.range .track { position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 4px; background: var(--chip-bd); }
.range .fill { position: absolute; top: 8px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent), oklch(0.72 0.13 195)); }
.range input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.range input::-webkit-slider-thumb { pointer-events: auto; -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 10px rgba(0,0,0,.25); cursor: grab; }
.range input::-moz-range-thumb { pointer-events: auto; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); cursor: grab; }
.range input::-webkit-slider-runnable-track { background: none; }

/* ---- Device ---- */
.devgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 8px; }
.dev { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; font-size: 12.5px; background: var(--chip); border: 1px solid var(--card-bd); }
.dev .dot { width: 16px; height: 16px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; background: var(--green); }
.dev.bad { background: var(--red-soft); border-color: var(--red-bd); color: var(--red-ink); } .dev.bad .dot { background: var(--red); }
.dev.warn { background: var(--amber-soft); border-color: transparent; color: var(--amber-ink); } .dev.warn .dot { background: var(--amber); }
.dev.wait { background: transparent; color: var(--text3); } .dev.wait .dot { background: var(--text3); }
ol.fix { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
ol.fix li { display: grid; grid-template-columns: 24px 1fr; gap: 6px; }
ol.fix li b:first-child { color: var(--accent); }

/* ---- Dropdown ---- */
.dd { position: relative; z-index: 3; }
.ddbtn { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 9px 12px; border-radius: 11px; background: var(--chip); border: 1px solid var(--chip-bd); cursor: pointer; }
.ddbtn:hover { background: var(--chip-hover); }
.ddbtn[aria-expanded=true] { border-color: var(--accent); }
.ddbtn[aria-expanded=true] svg { transform: rotate(180deg); }
.ddbtn svg { transition: transform .15s; flex: none; }
.ddpop { position: absolute; left: 0; right: 0; top: calc(100% + 8px); border-radius: 16px; background: var(--pop); border: 1px solid var(--chip-bd); box-shadow: 0 24px 60px rgba(0,0,0,.28); overflow: hidden; }
.ddsearch { display: flex; align-items: center; gap: 10px; margin: 10px; padding: 0 12px; border-radius: 10px; background: var(--chip); border: 1px solid var(--chip-bd); }
.ddsearch input { flex: 1; font: inherit; font-size: 14px; color: var(--text); background: none; border: 0; outline: none; padding: 10px 0; }
.ddlist { max-height: 300px; overflow-y: auto; padding: 0 6px 8px; border-top: 1px solid var(--card-bd); scrollbar-width: thin; }
.ddgroup { padding: 10px 10px 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); }
.ddopt { width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border-radius: 8px; cursor: pointer; background: transparent; border: 0; text-align: left; }
.ddopt:hover, .ddopt.kb { background: var(--chip-hover); }
.ddopt[aria-selected=true] { background: var(--accent-soft); }
.ddopt span.t { flex: 1; display: flex; flex-direction: column; gap: 2px; }

/* ---- Ready / checklist ---- */
.checks { display: flex; flex-direction: column; gap: 6px; }
.check { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 10px; background: var(--chip); }
.check .dot { width: 18px; height: 18px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; border: 1.5px solid var(--chip-bd); }
.check.ok .dot { background: var(--green); border-color: var(--green); }
.check span.t { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.check span.t span { font-size: 11.5px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rules { display: flex; flex-direction: column; gap: 5px; padding-top: 10px; border-top: 1px solid var(--card-bd); }
.rule { display: flex; gap: 8px; font-size: 12px; line-height: 1.4; color: var(--text2); }
.rule svg { flex: none; margin-top: 3px; }
.lastjob { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--chip); border: 1px solid var(--card-bd); color: var(--text); }
.lastjob:hover { background: var(--chip-hover); opacity: 1; }

/* ---- Phone frame ---- */
.phone { width: 250px; max-width: 100%; aspect-ratio: 9 / 20; border-radius: 38px; background: #0b0d12; padding: 9px; position: relative; box-shadow: 0 24px 60px rgba(0,0,0,.35), inset 0 0 0 2px #2b303b; flex: none; }
.phone::before { content: ""; position: absolute; right: -3px; top: 110px; width: 3px; height: 56px; border-radius: 2px; background: #2b303b; }
.phone::after { content: ""; position: absolute; right: -3px; top: 184px; width: 3px; height: 32px; border-radius: 2px; background: #2b303b; }
.phone .scr { position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; background: #f1f5f9; color: #0f172a; }
.phone .scr img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.phone.sm { width: 150px; border-radius: 24px; padding: 7px; }
.phone.sm .scr { border-radius: 18px; }
.phone .idle { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 0 18px; color: #475569; font-size: 12px; }
.phone .idle .ring { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #cbd5e1; border-top-color: #2563eb; animation: spin 1.4s linear infinite; }
.phone .idle .ring.still { animation: none; border-top-color: #cbd5e1; }
.phone .idle b { color: #0f172a; font-size: 13px; }
.phone .toast { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; border-radius: 8px; background: #b91c1c; color: #fff; font-weight: 600; font-size: 11px; box-shadow: 0 6px 16px rgba(0,0,0,.25); }

/* ---- Job ---- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 0; padding: 8px 12px; border-radius: 11px; background: var(--chip); border: 1px solid var(--card-bd); text-align: left; }
.stat .k { font-size: 11px; font-weight: 600; color: var(--text2); }
.stat .v { font-size: 22px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
button.stat { cursor: pointer; color: var(--text); font: inherit; }
button.stat:hover { filter: brightness(1.05); }
.stat.big .v { font-size: 24px; }
.stat.okc { background: var(--green-soft); border-color: transparent; } .stat.okc .k, .stat.okc .v { color: var(--green-ink); }
.stat.failc { background: var(--red-soft); border-color: transparent; } .stat.failc .k, .stat.failc .v { color: var(--red-ink); }
.stat.warnc { background: var(--amber); border-color: transparent; } .stat.warnc .k, .stat.warnc .v, .stat.warnc .muted { color: #231600; }
.segbar { display: flex; height: 7px; border-radius: 10px; overflow: hidden; background: var(--chip-bd); }
.segbar span { transition: width .3s; }
.manual { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: 12px; background: var(--amber); color: #231600; }
.manual button { font-size: 13px; font-weight: 700; color: #231600; padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.45); border: 0; cursor: pointer; }
.shots { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 12px; scrollbar-width: thin; }
.shotcard { flex: none; width: 180px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; border-radius: 14px; background: var(--chip); border: 1px solid var(--red-bd); cursor: pointer; text-align: left; }
.shotcard.warn { border-color: var(--amber); }
.shotcard:hover { background: var(--chip-hover); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }

.filters button span { opacity: .6; }

table.rows { width: 100%; min-width: 900px; border-collapse: collapse; font-size: 12.5px; }

.viewbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--accent); padding: 3px 8px; border-radius: 9px; background: var(--accent-soft); border: 0; cursor: pointer; }

.doneicon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; font-weight: 800; color: #fff; flex: none; }

/* ---- Dialogs ---- */
.scrim { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: var(--scrim); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.dialog { width: min(780px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 24px; background: var(--pop); border: 1px solid var(--chip-bd); box-shadow: 0 30px 80px rgba(0,0,0,.4); }
.dialog.shot { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.dialog.shot .phonecol { padding: 20px; display: grid; place-items: center; background: var(--chip); }
.dialog.shot .phone { width: min(250px, calc((100vh - 120px) * 0.45)); }
.dialog .side { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 8px; padding: 9px 0; border-top: 1px solid var(--card-bd); font-size: 14px; }
.kv:last-child { border-bottom: 1px solid var(--card-bd); }
.errtext { color: var(--red-ink); font-size: 13px; font-weight: 600; }

<body>
<div class="orbs" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="shell">
  <header class="top">
    <a class="brand" href="#/new" aria-label="LeadOps home">
      <span class="logo"><img src="assets/leadops-icon.png" alt=""></span>
      <span><b>Lead<span>Ops</span></b><span class="xs muted">Tractor Junction · Android</span></span>
    </a>
    <nav class="tabs hidden" id="nav" aria-label="Main">
      <a href="#/new" id="navNew">New job</a>
      <a href="#/jobs" id="navJobs">Jobs<span id="navPulse" class="pulse hidden"></span></a>
    </nav>
    <span class="userchip hidden" id="userChip"><span id="userMobile"></span><button class="btn sm" type="button" id="signOut">Sign out</button></span>
    <button class="iconbtn" id="themeBtn" type="button" title="Switch theme"></button>
  </header>
  <div id="view"></div>
</div>
<div id="modal"></div>
<input type="file" id="fileInput" accept=".xlsx" class="hidden">

<script>
'use strict';
/* =========================================================================
   Helpers
   ========================================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(k) { try { return localStorage.getItem('leadops.' + k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem('leadops.' + k) : localStorage.setItem('leadops.' + k, v); } catch {} },
};
// The agent runs on this computer. When the page is served by the agent itself, use relative
// URLs; when it is opened from GitHub Pages, talk to the local agent directly.
const AGENT = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && location.port === '4600' ? '' : 'http://127.0.0.1:4600';
const AGENT_DOWNLOAD = 'https://github.com/Roshan-4/leadops-dashboard/releases/latest';
const token = () => store.get('token');
/** URL for links / EventSource, which cannot send an Authorization header. */
const authUrl = (path) => `${AGENT}${path}${path.includes('?') ? '&' : '?'}token=${encodeURIComponent(token() || '')}`;
async function api(path, opts = {}) {
  let res;
  try {
    res = await fetch(AGENT + path, { ...opts, headers: { ...(opts.headers || {}), ...(token() ? { authorization: 'Bearer ' + token() } : {}) } });
  } catch {
    throw Object.assign(new Error('The LeadOps App Agent is not running on this computer.'), { offline: true });
  }
  const body = res.headers.get('content-type')?.includes('json') ? await res.json() : null;
  if (res.status === 401 && body?.error?.code === 'UNAUTHENTICATED') { store.set('token', null); store.set('user', null); setTimeout(route, 0); }
  if (!res.ok) throw Object.assign(new Error(body?.error?.message || res.statusText), { body: body?.error, status: res.status });
  return body;
}
const jobNo = (j) => '#' + String(j.number || 0).padStart(4, '0');
const fmtTime = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—');
const fmtWhen = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso), today = new Date();
  const same = d.toDateString() === today.toDateString();
  return (same ? 'Today ' : d.toLocaleDateString([], { day: 'numeric', month: 'short' }) + ' ') + fmtTime(iso);
};
const fmtDur = (ms) => { const s = Math.round((ms || 0) / 1000); return `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`; };
const eta = (n) => { const m = Math.round(n * 1.75); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const ICON = {
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
  check: (c = 'var(--accent)', w = 14) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>`,
  chevDown: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>',
  chevRight: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>',
  upload: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>',
  download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>',
  sheet: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  warn: (w = 22) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>`,
  phone: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="20" x="5" y="2" rx="2"/><path d="M12 18h.01"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:.6"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
  sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>',
  moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
};

/* =========================================================================
   Static content
   ========================================================================= */
const SPECIAL_IDS = ['home', 'pdp', 'brand-mahindra'];
const PAGE_DESC = {
  home: 'Finds the tractor in Home page carousels. Few tractors appear here, so many rows may be “not found”.',
  pdp: 'All Tractors → Brands filter → the tractor’s detail page.',
  'brand-mahindra': 'New Tractor → Brands → Mahindra. Non-Mahindra rows are flagged.',
};
const pageDesc = (p) => PAGE_DESC[p.id] || `New Tractor → ${p.name} → Brands filter → tractor → Check Tractor Price`;
const RULES = [
  'Only the exact tractor (Brand + Model) — never sent to another one',
  'Every row is filled fresh — earlier submissions are not skipped',
  'Uncertain submissions are flagged, never retried',
  'Stops only between rows when cancelled',
];
const SAMPLE_FALLBACK = { columns: ['S.No', 'Customer Name', 'Brand', 'Mobile', 'Model', 'State', 'District', 'Tehsil'], sampleRow: ['1', 'Ramesh Kumar', 'Massey Ferguson', '9876543210', '241 DI Maha Shakti', 'Uttar Pradesh', 'Azamgarh', 'Sagri'] };

/* =========================================================================
   State
   ========================================================================= */
const S = {
  pages: [],
  device: null, deviceCheckedAt: 0,
  upload: { state: 'empty' }, // empty | checking | done | error
  fromRaw: '1', toRaw: '1',
  page: store.get('page'),
  dd: { open: false, q: '', kb: -1 },
  jobs: [],
  job: null, es: null, filter: 'all', shot: null,
};

/* =========================================================================
   Theme
   ========================================================================= */
function effectiveTheme() {
  const t = store.get('theme');
  if (t === 'light' || t === 'dark') return t;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme() {
  const t = store.get('theme');
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const eff = effectiveTheme();
  $('#themeBtn').innerHTML = eff === 'dark' ? ICON.sun : ICON.moon;
  $('#themeBtn').title = eff === 'dark' ? 'Switch to light' : 'Switch to dark';
}
$('#themeBtn').addEventListener('click', () => { store.set('theme', effectiveTheme() === 'dark' ? 'light' : 'dark'); applyTheme(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

/* =========================================================================
   Router
   ========================================================================= */
function route() {
  const h = location.hash || '#/new';
  const m = h.match(/^#\/job\/([\w-]+)/);
  closeEventStream();
  S.shot = null; renderModal();
  renderUser();
  if (S.offline) return showOffline();
  if (!token()) return showLogin();
  if (m) return showJob(m[1]);
  if (h.startsWith('#/jobs')) return showJobs();
  return showNew();
}
function setNav(which) {
  $('#navNew').toggleAttribute('aria-current', which === 'new');
  $('#navJobs').toggleAttribute('aria-current', which !== 'new');
  if (which === 'new') $('#navNew').setAttribute('aria-current', 'page'); else $('#navJobs').setAttribute('aria-current', 'page');
}
window.addEventListener('hashchange', route);

/* =========================================================================
   Sign-in (with the user's own Tractor Junction app account)
   ========================================================================= */
const maskM = (m) => (m ? `${m.slice(0, 2)}XXXXXX${m.slice(-2)}` : '');
function renderUser() {
  const on = !!token() && !S.offline;
  $('#nav').classList.toggle('hidden', !on);
  $('#userChip').classList.toggle('hidden', !on);
  $('#userMobile').textContent = on ? maskM(store.get('user')) : '';
}
$('#signOut').addEventListener('click', async () => {
  try { await api('/api/v1/session/logout', { method: 'POST' }); } catch {}
  store.set('token', null); store.set('user', null);
  location.hash = '#/new'; route();
});
function showLogin() {
  S.view = 'login';
  $('#view').innerHTML = `<main class="center">
    <div class="pagehead" style="margin:0"><h1>Sign in</h1></div>
    <form class="card" id="loginForm" novalidate>
      <span class="small muted">Use your <b>Tractor Junction app</b> mobile number and password. They are checked by logging in to the app on the connected phone (about 30 seconds).</span>
      <label class="field">Mobile number<input id="lMobile" inputmode="numeric" autocomplete="username" maxlength="13" placeholder="10-digit mobile number" required></label>
      <label class="field">Password<input id="lPass" type="password" autocomplete="current-password" required></label>
      <div id="loginDev"></div>
      <button class="cta" id="lGo" type="submit">Sign in ${ICON.arrow}</button>
      <span class="small" id="lMsg" role="alert"></span>
    </form>
    <span class="xs faint">Your password is saved encrypted on this computer only, so you stay signed in. Sign out to remove it.</span>
  </main>`;
  renderLoginDevice();
  $('#lMobile').focus();
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const mobile = $('#lMobile').value.replace(/\D/g, '').replace(/^91(?=\d{10}$)/, ''), password = $('#lPass').value;
    const msg = $('#lMsg');
    if (!/^[6-9]\d{9}$/.test(mobile)) { msg.style.color = 'var(--red-ink)'; msg.textContent = 'Enter your 10-digit mobile number.'; return; }
    if (!password) { msg.style.color = 'var(--red-ink)'; msg.textContent = 'Enter your password.'; return; }
    $('#lGo').disabled = true;
    msg.style.color = 'var(--text2)';
    msg.innerHTML = '<span class="spinner" style="width:14px;height:14px;vertical-align:-2px"></span> Logging in to the Tractor Junction app on your phone…';
    try {
      const r = await api('/api/v1/session', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mobile, password }) });
      store.set('token', r.token); store.set('user', r.mobile);
      location.hash = '#/new'; route(); loadDevice();
    } catch (err) {
      msg.style.color = 'var(--red-ink)';
      msg.textContent = err.body?.code === 'LOGIN_FAILED' ? `Login failed — ${err.message}` : err.message;
      $('#lGo').disabled = false;

}
function renderLoginDevice() {
  const el = $('#loginDev'), d = S.device;
  if (!el) return;
  el.innerHTML = !d ? '' : d.device && d.appInstalled
    ? `<div class="dev"><span class="dot">✓</span>Phone connected (${esc(d.device.model || d.device.id)})</div>`
    : `<div class="dev bad"><span class="dot">!</span>${d.unauthorized ? 'Allow USB debugging on the phone' : d.device ? 'Install the Tractor Junction app on the phone' : 'Connect the phone by USB to sign in'}</div>`;
}
function showOffline() {
  S.view = 'offline';
  $('#view').innerHTML = `<main class="center">
    <div class="pagehead" style="margin:0"><h1>LeadOps App Agent isn’t running</h1></div>
    <div class="card">
      <span class="small">This dashboard drives the phone through the <b>LeadOps App Agent</b> on this computer.</span>
      <ol class="fix">
        <li><b>1</b><span>Install it once: <a href="${AGENT_DOWNLOAD}" target="_blank" rel="noopener">download LeadOps App Agent for Windows</a>.</span></li>
        <li><b>2</b><span>Start <b>LeadOps App Agent</b> from the Start menu (it also starts with Windows).</span></li>
        <li><b>3</b><span>If the browser asks to “access devices on your local network”, click <b>Allow</b>.</span></li>
      </ol>
      <span class="xs muted">This page checks again every 10 seconds.</span>
    </div>
  </main>`;
}

/* =========================================================================
   Device polling + phone preview
   ========================================================================= */
async function loadDevice() {
  try {
    S.device = await api('/api/v1/device');
    if (S.offline) { S.offline = false; route(); }
  } catch (e) {
    S.device = { adb: false, device: null, error: 'Could not check the device' };
    if (e.offline && !S.offline) { S.offline = true; route(); }
  }
  S.deviceCheckedAt = Date.now();
  $('#navPulse').classList.toggle('hidden', !S.device?.busy);
  if (S.view === 'new') { renderDevice(); renderReady(); }
  if (S.view === 'login') renderLoginDevice();
}
setInterval(loadDevice, 10_000);

function phoneFrame({ imgId = '', src = '', idleText = '', idleStill = false, toast = '', small = false } = {}) {
  return `<div class="phone ${small ? 'sm' : ''}"><div class="scr">
    <img ${imgId ? `id="${imgId}"` : ''} alt="Phone screen" class="${src ? '' : 'hidden'}" ${src ? `src="${esc(src)}"` : ''}>
    <div class="idle ${src ? 'hidden' : ''}"><span class="ring ${idleStill ? 'still' : ''}"></span><b>${esc(idleText)}</b></div>
    ${toast ? `<div class="toast">${esc(toast)}</div>` : ''}
  </div></div>`;
}

/* =========================================================================
   NEW JOB
   ========================================================================= */
function rangeState() {
  const total = S.upload.state === 'done' ? S.upload.validCount : 0;
  const fromN = parseInt(S.fromRaw, 10), toN = parseInt(S.toRaw, 10);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const from = clamp(isNaN(fromN) ? 1 : fromN, 1, Math.max(total, 1));
  const to = clamp(isNaN(toN) ? from : toN, 1, Math.max(total, 1));
  let err = '';
  if (total) {
    if (isNaN(fromN) || isNaN(toN)) err = 'Enter both row numbers.';
    else if (fromN < 1 || toN < 1) err = 'Rows start at 1.';
    else if (fromN > total || toN > total) err = `This Excel has ${total} valid rows — the last row is ${total}.`;
    else if (toN < fromN) err = '“To row” must be the same as or after “From row”.';
  }
  const count = total && !err ? to - from + 1 : 0;
  return { total, from, to, count, err };
}
const selectedPage = () => S.pages.find((p) => p.id === S.page);

function showNew() {
  S.view = 'new'; setNav('new');
  $('#view').innerHTML = `
  <main class="newjob">

      <section class="card" aria-labelledby="h-up">
        <div class="sechead"><span class="stepnum" id="s1">1</span><h2 id="h-up">Upload Excel</h2><a href="${authUrl('/api/v1/sample.xlsx')}" class="xs" style="margin-left:auto">Download sample template</a></div>
        <div id="upBody"></div>
      </section>
      <section class="card" aria-labelledby="h-rows">
        <div class="sechead"><span class="stepnum" id="s3">2</span><h2 id="h-rows">Rows &amp; device</h2></div>
        <div class="panel" id="rowsPanel"></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <div class="sechead" style="gap:10px"><b>Phone</b><span class="xs faint" style="margin-left:auto">Auto-checks every 10 s</span><button class="btn sm" type="button" id="checkNow">Check now</button></div>
          <div id="devBody"></div>
        </div>
      </section>
      <section class="card wide" aria-labelledby="h-page" style="position:relative;z-index:3">
        <div class="sechead"><span class="stepnum" id="s2">3</span><h2 id="h-page">Choose page</h2></div>
        <div class="dd" id="dd"></div>
        <span class="xs faint">${S.pages.length || 15} pages · last choice is remembered on this browser</span>
      </section>
    </div>
    <aside class="card" id="ready" aria-label="Ready to submit"></aside>
  </main>`;
  $('#checkNow').addEventListener('click', async (e) => { e.currentTarget.disabled = true; await loadDevice(); e.currentTarget.disabled = false; });
  renderUpload(); renderRows(); renderDevice(); renderDropdown(); renderReady();
  loadJobsList().then(renderReady);
}

/* ---- Step 1: upload ---- */
function renderUpload() {
  const u = S.upload, el = $('#upBody');
  if (!el) return;
  $('#s1').classList.toggle('done', u.state === 'done');
  if (u.state === 'empty') {
    el.innerHTML = `<div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose an Excel file">
      <div class="ico">${ICON.upload}</div>
      <div style="display:flex;flex-direction:column;gap:2px"><b>Drop your .xlsx here or click to browse</b><span class="small muted">First sheet only · max 5 MB · max 500 rows</span></div></div>`;
    const drop = $('#drop');
    drop.addEventListener('click', () => $('#fileInput').click());
    drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#fileInput').click(); } });
    ['dragover', 'dragenter'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
    drop.addEventListener('drop', (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) uploadFile(f); });
  } else if (u.state === 'checking') {
    el.innerHTML = `<div class="filebar"><span class="spinner"></span><span>Checking ${esc(u.filename)}…</span></div>`;
  } else if (u.state === 'error') {
    const sample = u.sample || SAMPLE_FALLBACK, missing = new Set(u.missingColumns || []);
    el.innerHTML = `<div class="reject">
      <div class="bar">${ICON.x}<b>${esc(u.filename)} was rejected${u.sample ? ' — wrong format' : ''}</b><button class="btn sm" type="button" data-act="choose" style="margin-left:auto;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.5);color:#fff">Choose another file</button></div>
      <div class="body">
        <p style="margin:0;white-space:pre-line">${esc((u.message || '').split('\n')[0])}</p>
        ${u.sample ? `<span class="small">Row 1 of your sheet must contain these exact headers. Extra columns are ignored.${missing.size ? ' Columns underlined in red are missing from your file.' : ''}</span>

  } else {

        <button class="btn sm" type="button" data-act="choose">Replace file</button></div>
      ${u.invalid.length ? `<div class="note red"><b>${u.invalid.length} row${u.invalid.length === 1 ? '' : 's'} skipped — fix in Excel and re-upload</b>
        ${u.invalid.slice(0, 8).map((r) => `<span><b>Row ${r.sourceRow}</b> · ${esc(r.errors.join('; '))}</span>`).join('')}

$('#fileInput').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadFile(f); });

async function uploadFile(file) {
  S.upload = { state: 'checking', filename: file.name };
  renderUpload(); renderRows(); renderReady();
  try {
    const up = await api('/api/v1/uploads', { method: 'POST', headers: { 'x-filename': encodeURIComponent(file.name), 'content-type': 'application/octet-stream' }, body: file });
    S.upload = { state: 'done', ...up };
    S.fromRaw = '1'; S.toRaw = String(Math.min(up.validCount, Math.max(1, up.validCount)));
  } catch (e) {
    S.upload = { state: 'error', filename: file.name, message: e.message, sample: e.body?.sample, missingColumns: e.body?.missingColumns };
  }
  renderUpload(); renderRows(); renderReady();
}

/* ---- Step 2: rows ---- */

    <div class="sechead" style="gap:10px;align-items:flex-end">
      <label class="lbl">From row<input class="numin" type="number" id="fromIn" min="1" ${on ? `max="${r.total}"` : ''} value="${esc(S.fromRaw)}" ${on ? '' : 'disabled'}></label>
      <span class="faint" style="padding-bottom:7px">–</span>
      <label class="lbl">To row<input class="numin" type="number" id="toIn" min="1" ${on ? `max="${r.total}"` : ''} value="${esc(S.toRaw)}" ${on ? '' : 'disabled'}></label>

        <input type="range" id="toSl" min="1" max="${Math.max(r.total, 1)}" value="${r.to}" aria-label="To row" ${on ? '' : 'disabled'}></div>

    </div>
    <span class="errtext" id="rangeErr" role="alert"></span>`;
  const sync = () => {
    const s = rangeState(), pct = (v) => ((v - 1) / Math.max(s.total - 1, 1)) * 100;
    $('#rangeFill').style.left = pct(s.from) + '%';
    $('#rangeFill').style.width = Math.max(0, pct(s.to) - pct(s.from)) + '%';

  $('#toIn').addEventListener('input', (e) => { S.toRaw = e.target.value; $('#toSl').value = rangeState().to; sync(); });
  $('#fromSl').addEventListener('input', (e) => { const v = +e.target.value; S.fromRaw = String(v); if (v > rangeState().to) { S.toRaw = String(v); $('#toSl').value = v; $('#toIn').value = v; } $('#fromIn').value = v; sync(); });
  $('#toSl').addEventListener('input', (e) => { const v = +e.target.value; S.toRaw = String(v); if (v < rangeState().from) { S.fromRaw = String(v); $('#fromSl').value = v; $('#fromIn').value = v; } $('#toIn').value = v; sync(); });
  sync();
}

/* ---- Step 2: device ---- */

/* ---- Step 3: page dropdown ---- */
function ddOptions() {
  const q = S.dd.q.trim().toLowerCase();
  const match = (p) => !q || p.name.toLowerCase().includes(q);
  const special = S.pages.filter((p) => SPECIAL_IDS.includes(p.id) && match(p));
  const listing = S.pages.filter((p) => !SPECIAL_IDS.includes(p.id) && match(p));
  return { q, special, listing, flat: [...special, ...listing] };
}
function renderDropdown() {
  const el = $('#dd');
  if (!el) return;
  const p = selectedPage();
  $('#s2').classList.toggle('done', !!p);
  el.innerHTML = `<button type="button" class="ddbtn" id="ddBtn" aria-haspopup="listbox" aria-expanded="${S.dd.open}">
      <span style="display:flex;flex-direction:column;gap:2px;min-width:0;flex:1"><b style="color:${p ? 'var(--text)' : 'var(--text2)'}">${p ? esc(p.name) : 'Select a page…'}</b>
      <span style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" class="muted">${p ? esc(pageDesc(p)) : 'Where in the app the lead form will be filled'}</span></span>${ICON.chevDown}</button>
    ${S.dd.open ? `<div class="ddpop"><div class="ddsearch">${ICON.search}<input id="ddQ" placeholder="Search pages…" autocomplete="off" value="${esc(S.dd.q)}" aria-label="Search pages"></div>
      <div class="ddlist" id="ddList" role="listbox" aria-label="Pages"></div></div>` : ''}`;
  $('#ddBtn').addEventListener('click', () => { S.dd.open = !S.dd.open; S.dd.q = ''; S.dd.kb = -1; renderDropdown(); if (S.dd.open) $('#ddQ').focus(); });
  if (S.dd.open) {
    renderDdList();
    $('#ddQ').addEventListener('input', (e) => { S.dd.q = e.target.value; S.dd.kb = -1; renderDdList(); });
    $('#ddQ').addEventListener('keydown', (e) => {
      const { flat } = ddOptions();
      if (e.key === 'ArrowDown') { e.preventDefault(); S.dd.kb = Math.min(flat.length - 1, S.dd.kb + 1); renderDdList(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); S.dd.kb = Math.max(0, S.dd.kb - 1); renderDdList(); }
      else if (e.key === 'Enter' && flat[S.dd.kb]) { e.preventDefault(); pickPage(flat[S.dd.kb].id); }
      else if (e.key === 'Escape') { S.dd.open = false; renderDropdown(); $('#ddBtn').focus(); }
    });
  }
}
function renderDdList() {
  const { q, special, listing, flat } = ddOptions();
  const opt = (p) => `<button type="button" class="ddopt ${flat[S.dd.kb] === p ? 'kb' : ''}" role="option" aria-selected="${p.id === S.page}" data-page="${esc(p.id)}">
      <span class="t"><span style="font-size:14px;font-weight:600">${esc(p.name)}</span><span style="font-size:12.5px;line-height:1.4" class="muted">${esc(pageDesc(p))}</span></span>
      ${p.id === S.page ? ICON.check('var(--green)', 16) : ''}</button>`;
  $('#ddList').innerHTML = `
    ${!q ? `<button type="button" class="ddopt" role="option" aria-selected="${!S.page}" data-page=""><span class="t"><span style="font-size:14px;font-weight:600" class="muted">Select page</span><span style="font-size:12.5px" class="faint">No page selected — clears the current choice</span></span>${!S.page ? ICON.check('var(--green)', 16) : ''}</button>` : ''}
    ${special.map(opt).join('')}
    ${listing.length ? `<div class="ddgroup">Tractor listings</div>${listing.map(opt).join('')}` : ''}
    ${!flat.length ? `<div style="padding:18px 10px" class="small muted">No page matches “${esc(S.dd.q)}”.</div>` : ''}`;
  $('#ddList').querySelectorAll('[data-page]').forEach((b) => b.addEventListener('click', () => pickPage(b.dataset.page)));
  $('#ddList').querySelector('.kb')?.scrollIntoView({ block: 'nearest' });
}
function pickPage(id) {
  S.page = id || null; store.set('page', S.page);
  S.dd.open = false; renderDropdown(); renderReady();
}
document.addEventListener('mousedown', (e) => { if (S.dd.open && !e.target.closest('#dd')) { S.dd.open = false; renderDropdown(); } });

/* ---- Ready panel ---- */
function readyInfo() {
  const u = S.upload, r = rangeState(), p = selectedPage(), d = S.device;
  const uploaded = u.state === 'done' && u.validCount > 0;
  const phoneOk = !!(d?.device && d.appInstalled && !d.busy);
  const ready = uploaded && !!p && phoneOk && r.count > 0;
  const missing = [!uploaded && 'upload a valid Excel file', !!r.err && 'fix the row range', !d?.device && 'connect the phone', d?.device && !d.appInstalled && 'install the app', !p && 'select a page'].filter(Boolean);
  return { u, r, p, d, uploaded, phoneOk, ready, missing };
}
function renderReady() {
  const el = $('#ready');

  const { u, r, p, d, uploaded, ready, missing, phoneOk } = readyInfo();
  const chk = (ok, k, v) => `<div class="check ${ok ? 'ok' : ''}"><span class="dot">${ok ? '✓' : ''}</span><span class="t"><b style="font-size:14px">${k}</b><span>${esc(v)}</span></span></div>`;
  const last = S.jobs[0];
  const hint = d?.busy ? 'A job is already running on this device. Wait for it to finish or cancel it.'
    : ready ? `Submits rows ${r.from}–${r.to} from ${u.filename} on ${p.name} as real leads.`
    : `To submit: ${missing.join(', ') || 'wait for the phone check'}.`;
  el.innerHTML = `
    <h3 style="font-size:14px">Ready to submit</h3>
    <div class="checks">
      ${chk(uploaded, 'Excel file', uploaded ? `${u.validCount} valid rows` : u.state === 'checking' ? 'Checking…' : 'Not uploaded')}
      ${chk(uploaded && r.count > 0, 'Rows', uploaded ? (r.count ? `Rows ${r.from}–${r.to} · ${r.count} lead${r.count === 1 ? '' : 's'}` : 'Fix the row range') : '—')}
      ${chk(phoneOk, 'Phone', !d ? 'Checking…' : d.busy ? 'Busy — a job is running' : d.device ? `${d.device.model || d.device.id}${d.appInstalled ? ' · app installed' : ' · app missing'}` : 'Not connected')}
      ${chk(!!p, 'Page', p ? p.name : 'Not selected')}
    </div>
    <button type="button" class="cta" id="startBtn" ${ready ? '' : 'disabled'}>${ready ? `Submit ${r.count} lead${r.count === 1 ? '' : 's'}` : 'Submit leads'}${ICON.arrow}</button>
    <span class="small" style="line-height:1.45;color:${ready ? 'var(--text2)' : 'var(--amber-ink)'}" id="hint">${esc(hint)}</span>
    <span class="errtext" id="startErr" role="alert"></span>
    <div class="rules"><b style="font-size:14px">How submission works</b>${RULES.map((x) => `<div class="rule">${ICON.check()}<span>${x}</span></div>`).join('')}</div>
    ${last ? `<a class="lastjob" href="#/job/${esc(last.id)}"><span style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1"><span class="xs muted">Last job ${jobNo(last)} · ${esc(last.pageName)}</span>
      <span style="display:flex;align-items:center;gap:8px">${statusPill(last)}<b class="small num">${doneCount(last)}</b></span></span>${ICON.chevRight}</a>` : ''}`;
  $('#startBtn').addEventListener('click', startJob);
}

/* ---- Start ---- */
async function startJob() {
  const { r, p, u } = readyInfo();
  const btn = $('#startBtn'); if (btn) btn.disabled = true;
  try {
    const job = await api('/api/v1/jobs', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ uploadId: u.id, pageId: p.id, from: r.from, to: r.to, confirm: true, mode: 'submit', confirmSubmit: true }) });
    loadDevice();
    location.hash = '#/job/' + job.id;
    return '';
  } catch (e) {
    const msg = e.status === 400 && /Upload a valid Excel/.test(e.message) ? 'The upload expired (the dashboard was restarted). Please upload the file again.' : e.message;
    if ($('#startErr')) $('#startErr').textContent = msg;
    if (btn) btn.disabled = false;
    loadDevice();
    return msg;
  }
}

/* =========================================================================
   JOB helpers
   ========================================================================= */
const LIVE = ['queued', 'running', 'cancelling'];
const isLive = (j) => LIVE.includes(j.status);
function rowKind(r) {
  if (r.needsReview) return 'warn';
  return { succeeded: 'ok', failed: 'fail', skipped: 'skip', running: 'run', pending: 'pend' }[r.status] || 'pend';
}
function rowPill(r, j) {
  const k = rowKind(r);
  const label = { ok: '✓ Submitted', fail: '✕ Failed', warn: '⚠ Needs manual check', skip: 'Skipped', run: '● Running', pend: 'Pending' }[k];
  return `<span class="pill ${k}">${label}</span>`;
}
function rowDetail(r) {
  if (r.status === 'running') return { cat: 'IN PROGRESS', cls: 'dim', text: r.step || '' };
  if (r.status === 'pending') return { cat: '', cls: 'dim', text: '' };
  if (r.status === 'succeeded') {
    const m = /^(.*) \(by (tehsil|district)\)$/.exec(r.location || '');
    return { cat: m ? `BY ${m[2].toUpperCase()}` : '', cls: 'good', text: m ? m[1] : r.location || '' };
  }
  return { cat: r.category || '', cls: r.status === 'skipped' && !r.needsReview ? 'dim' : 'bad', text: r.needsReview ? `${r.error || ''} — lead may exist, not retried` : r.error || '' };
}
function counts(j) {
  const c = { ok: 0, fail: 0, warn: 0, skip: 0, pend: 0 };
  for (const r of j.records) { const k = rowKind(r); c[k === 'run' ? 'pend' : k]++; }
  return c;
}
const doneCount = (j) => `${j.records.filter((r) => r.status === 'succeeded').length} / ${j.records.length}`;
function statusPill(j) {
  const map = {
    queued: ['run', 'Starting'], running: ['run', 'Running'], cancelling: ['run', 'Cancelling'],
    completed: ['ok', 'Completed'], completed_with_errors: ['warnsoft', 'Completed with errors'], failed: ['fail', 'Failed'], cancelled: ['skip', 'Cancelled'],
  };
  const [cls, label] = map[j.status] || ['skip', j.status];
  return `<span class="pill ${cls}">${label}</span>`;
}
const shotUrl = (j, r) => authUrl(`/api/v1/jobs/${j.id}/screens/${r.screenshot}`);
const shotRows = (j) => j.records.filter((r) => r.screenshot && !['pending', 'running'].includes(r.status));

    </section>`;
  }
  const manual = c.warn ? `<div class="manual">${ICON.warn()}<span style="font-size:14px;flex:1;min-width:220px"><b>${c.warn} row${c.warn === 1 ? '' : 's'} need${c.warn === 1 ? 's' : ''} manual check.</b> Submitted but “Thank You For Enquiry” never appeared — a real lead may exist. ${c.warn === 1 ? 'It' : 'They'} will not be retried.</span><button type="button" data-filter="manual">Show row${c.warn === 1 ? '' : 's'}</button></div>` : '';
  const bad = shotRows(j).filter((r) => r.status === 'failed' || r.needsReview);
  const strip = bad.length ? `<section class="card big" style="gap:10px">
      <div class="sechead" style="align-items:baseline;gap:10px"><h2 style="font-size:15px">Failed &amp; needs-check screenshots</h2><span class="small muted">${bad.length} row${bad.length === 1 ? '' : 's'} · what the phone showed when the row stopped</span></div>
      <div class="shots">${bad.map((r) => { const d = rowDetail(r); return `<button type="button" class="shotcard ${r.needsReview ? 'warn' : ''}" data-shot="${r.sourceRow}">
        ${phoneFrame({ src: shotUrl(j, r), small: true })}
        <span style="align-self:stretch;display:flex;flex-direction:column;gap:4px"><span style="display:flex;align-items:center;gap:8px;min-width:0"><b>Row ${r.sourceRow}</b><span class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span></span>
        ${rowPill(r, j)}<span class="cat bad">${esc(d.cat)}</span><span style="font-size:12.5px;line-height:1.4" class="muted">${esc(d.text)}</span></span></button>`; }).join('')}</div></section>` : '';
  $('#jobMain').innerHTML = head + manual + strip + `<section class="card big" style="gap:10px"><div class="filters" id="filters"></div><div class="tablewrap" id="rowsTable"></div></section>`;
  $('#cancelBtn')?.addEventListener('click', async (e) => { e.currentTarget.disabled = true; try { await api(`/api/v1/jobs/${j.id}/cancel`, { method: 'POST' }); } catch (err) { alert(err.message); } });
  $('#jobMain').querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { S.filter = b.dataset.filter; renderTable(); $('#filters').scrollIntoView({ behavior: 'smooth', block: 'center' }); }));
  $('#jobMain').querySelectorAll('[data-shot]').forEach((b) => b.addEventListener('click', () => openShot(+b.dataset.shot)));
  renderTable();
}
const FILTERS = { all: () => true, ok: (r) => r.status === 'succeeded', manual: (r) => r.needsReview, failed: (r) => r.status === 'failed' && !r.needsReview, skipped: (r) => r.status === 'skipped' };
function renderTable() {
  const j = S.job, c = counts(j);
  const f = (id, label, n) => `<button type="button" aria-pressed="${S.filter === id}" data-f="${id}">${label} <span>${n}</span></button>`;
  $('#filters').innerHTML = f('all', 'All', j.records.length) + f('ok', 'Submitted', c.ok) + f('manual', 'Needs check', c.warn) + f('failed', 'Failed', c.fail) + f('skipped', 'Skipped', c.skip);
  $('#filters').querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => { S.filter = b.dataset.f; renderTable(); }));
  const rows = j.records.filter(FILTERS[S.filter]);
  const shots = new Set(shotRows(j).map((r) => r.sourceRow));
  $('#rowsTable').innerHTML = rows.length ? `<table class="rows"><thead><tr><th>Row</th><th>Name</th><th>Mobile</th><th>Tractor</th><th>Status</th><th>Location / error</th><th>Time</th><th>Screenshot</th></tr></thead><tbody>
    ${rows.map((r) => { const d = rowDetail(r), k = rowKind(r); return `<tr class="${k === 'warn' ? 'warn' : k === 'run' ? 'run' : k === 'pend' ? 'pend' : ''}">
      <td class="num"><b>${r.sourceRow}</b></td><td>${esc(r.name)}</td><td class="num">${esc(r.mobile)}</td><td>${esc(r.tractor)}</td><td>${rowPill(r, j)}</td>
      <td><span class="cat ${d.cls}">${esc(d.cat)}</span><span>${esc(d.text)}</span></td>
      <td class="num muted">${r.status === 'pending' ? '' : r.status === 'running' ? '…' : r.ms ? fmtDur(r.ms) : '—'}</td>
      <td>${shots.has(r.sourceRow) ? `<button type="button" class="viewbtn" data-shot="${r.sourceRow}">${ICON.phone}View</button>` : ''}</td></tr>`; }).join('')}
    </tbody></table>` : '<span class="small muted" style="padding:8px 10px">No rows in this filter.</span>';
  $('#rowsTable').querySelectorAll('[data-shot]').forEach((b) => b.addEventListener('click', () => openShot(+b.dataset.shot)));
}
/* ---- Screenshot lightbox ---- */
function openShot(sourceRow) { S.shot = sourceRow; renderModal(); }
function renderModal() {
  const j = S.job;
  if (!S.shot || !j) { $('#modal').innerHTML = ''; return; }
  const list = shotRows(j), i = list.findIndex((r) => r.sourceRow === S.shot);
  if (i < 0) { S.shot = null; $('#modal').innerHTML = ''; return; }
  const r = list[i], d = rowDetail(r);
  $('#modal').innerHTML = `<div class="scrim" id="scrim"><div class="dialog shot" role="dialog" aria-modal="true" aria-labelledby="shotTitle">
    <div class="phonecol">${phoneFrame({ src: shotUrl(j, r) })}</div>
    <div class="side">
      <div class="sechead" style="gap:10px"><span class="xs muted">Job ${jobNo(j)} · screenshot ${i + 1} of ${list.length}</span><button class="iconbtn" type="button" id="shotClose" style="margin-left:auto;width:36px;height:36px" aria-label="Close">${ICON.x}</button></div>
      <h2 id="shotTitle" style="font-size:22px">Row ${r.sourceRow} · ${esc(r.name)}</h2>
      <span>${rowPill(r, j)}</span>
      <div><div class="kv"><span class="muted">Mobile</span><span>${esc(r.mobile)}</span></div>
        <div class="kv"><span class="muted">Tractor</span><span>${esc(r.tractor)}</span></div>
        <div class="kv"><span class="muted">${r.status === 'succeeded' ? 'Location' : 'Reason'}</span><span><span class="cat ${d.cls}">${esc(d.cat)}</span>${esc(d.text)}</span></div></div>
      <div class="sechead" style="gap:10px;margin-top:auto"><button class="btn" type="button" id="shotPrev">← Previous</button><button class="btn" type="button" id="shotNext">Next →</button></div>
    </div></div></div>`;
  const move = (dlt) => { S.shot = list[(i + dlt + list.length) % list.length].sourceRow; renderModal(); };
  const close = () => { S.shot = null; $('#modal').innerHTML = ''; };
  $('#shotClose').addEventListener('click', close);
  $('#shotPrev').addEventListener('click', () => move(-1));
  $('#shotNext').addEventListener('click', () => move(1));
  $('#scrim').addEventListener('click', (e) => { if (e.target.id === 'scrim') close(); });
  $('#shotClose').focus();
}
document.addEventListener('keydown', (e) => {
  if (!S.shot) return;
  if (e.key === 'Escape') { S.shot = null; $('#modal').innerHTML = ''; }
  if (e.key === 'ArrowLeft') $('#shotPrev')?.click();
  if (e.key === 'ArrowRight') $('#shotNext')?.click();
});

/* =========================================================================
   JOBS page
   ========================================================================= */
async function loadJobsList() { try { S.jobs = await api('/api/v1/jobs'); } catch { S.jobs = []; } return S.jobs; }
async function showJobs() {
  S.view = 'jobs'; setNav('jobs'); S.job = null;
  $('#view').innerHTML = `<main class="narrow">
    <div class="sechead" style="align-items:flex-end;gap:16px"><div style="display:flex;flex-direction:column;gap:4px;margin-right:auto"><h1 style="font-size:18px">Jobs</h1><span class="xs muted">Newest first · last 50 · kept across restarts</span></div><a class="btn go" href="#/new">New job</a></div>
    <section class="card big" style="padding:12px 20px"><div class="tablewrap" id="hist"><span class="muted small" style="padding:12px 0"><span class="spinner"></span> Loading…</span></div></section></main>`;
  const list = await loadJobsList();
  $('#hist').innerHTML = list.length ? `<table class="hist"><thead><tr><th>Started</th><th>Job</th><th>Page</th><th>File</th><th>Status</th><th>Done</th><th></th></tr></thead><tbody>
    ${list.map((j) => { const c = counts(j); return `<tr><td class="num muted">${fmtWhen(j.startedAt || j.createdAt)}</td><td><b>${jobNo(j)}</b></td><td>${esc(j.pageName)}</td><td style="overflow-wrap:anywhere">${esc(j.filename)}</td>
      <td><span style="display:inline-flex;flex-direction:column;gap:3px">${statusPill(j)}${c.warn ? `<span class="xs" style="color:var(--amber-ink)">${c.warn} need${c.warn === 1 ? 's' : ''} manual check</span>` : ''}${j.status === 'failed' && j.message ? `<span class="xs muted">${esc(j.message)}</span>` : ''}</span></td>
      <td class="num"><b>${doneCount(j)}</b></td><td><a href="#/job/${esc(j.id)}" class="small" style="font-weight:600">View →</a></td></tr>`; }).join('')}
    </tbody></table>` : '<div style="padding:24px 0;display:flex;flex-direction:column;gap:8px"><b>No jobs yet</b><span class="small muted">Start a job from the New job page — it will appear here.</span></div>';
}

/* =========================================================================
   Boot
   ========================================================================= */
applyTheme();
(async () => {
  try { S.pages = await api('/api/v1/pages'); } catch (e) { S.pages = []; if (e.offline) S.offline = true; }
  if (S.page && !S.pages.some((p) => p.id === S.page)) S.page = null;
  if (!S.offline && token()) {
    try { const me = await api('/api/v1/session'); store.set('user', me.mobile); } catch {}
  }
  route();
  loadDevice();
})();
</script>
</body>
